# Configuracion de mpv para "Ver en tiempo real". La carga scripts\ver-en-vivo.bat
# con --config-dir, asi que solo se usa al ver en tiempo real: abrir mpv por otro
# lado (o un mpv instalado aparte en la PC) no la toma.

# Decodifica en la GPU (NVDEC) y copia los frames a RAM: VapourSynth los
# necesita en memoria.
hwdec=auto-copy

# Saltos al fotograma clave (flechas, clic en la barra). Con RIFE en vivo
# retoman en menos de 1 s. Un salto exacto obliga a pasar por RIFE todos los
# frames desde el fotograma clave anterior, y tardaba hasta 5 s. A cambio, un
# salto puede caer unos segundos antes del punto pedido.
hr-seek=no

# Los saltos exactos que quedan (Shift+flechas, avanzar de a un frame) pasan
# por RIFE todos los frames desde el fotograma clave. Sin esto, mpv descarta
# frames antes de RIFE para ir mas rapido y, como RIFE agrega frames, termina
# mostrando otro momento del video: medido, saltar al segundo 3 mostraba el
# frame del segundo 4.2. El propio manual de mpv advierte este caso.
hr-seek-framedrop=no

# Al cerrar, recuerda por donde ibas y al reabrir el video sigue desde ahi.
save-position-on-quit=yes
